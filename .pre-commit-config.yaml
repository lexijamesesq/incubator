# default_install_hook_types + default_stages: see dotty's .pre-commit-config.yaml
# for the full rationale (a bare `pre-commit install` must wire pre-commit, pre-push,
# AND commit-msg, and default_stages keeps hooks with no explicit `stages` key from
# being silently promoted to those other stages).
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/lexijamesesq/dotty
    rev: v2026.09.26
    hooks:
      - id: gitleaks-staged
      - id: gitleaks-pre-push
      - id: gitleaks-commit-msg
      - id: house-code
      - id: house-scaffold-no-tracked-scratch
      - id: house-scaffold-sample-shape
      - id: house-scaffold-sample-placeholder
      - id: vale-self-narration

  - repo: local
    hooks:
      - id: check-file-presence
        name: check required files exist (README, LICENSE)
        entry: bash -c 'missing=""; [ ! -f README.md ] && missing="$missing README.md"; [ ! -f LICENSE ] && missing="$missing LICENSE"; [ -n "$missing" ] && echo "Missing required files:$missing" && exit 1; exit 0'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        stages: [pre-commit]
