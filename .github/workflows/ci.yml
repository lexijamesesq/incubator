name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

# Cancel a superseded in-flight run when a PR gets a new push — but NEVER cancel
# a push-to-main run (cancel is gated to pull_request events; on push-to-main
# `cancel-in-progress` is false). On `pull_request`, github.ref is already
# per-PR (refs/pull/<N>/merge), so the group is PR-scoped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  floor:
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1

  all-checks-passed:
    needs: [floor, ruff, shellcheck, release-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded (a job skipped on a mechanical PR is satisfied)
        env:
          RESULTS: ${{ toJSON(needs) }}
          MECHANICAL: ${{ needs.floor.outputs.mechanical }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A skipped job is satisfied on a mechanical PR (the floor skipped
          # it) and on any non-PR event (a push to the default branch, where
          # any job skipped by its own `if:` is not a PR's failure); on a
          # functional PR a skipped job is a failure.
          bad="$(jq -r --arg mech "$MECHANICAL" --arg event "$EVENT" '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled"
                     or (.value.result == "skipped" and $mech != "true" and $event == "pull_request"))
            | .key' <<<"$RESULTS")"
          if [[ -n "$bad" ]]; then
            echo "required job(s) not satisfied: $bad"
            exit 1
          fi
          echo "all checks passed (event=${EVENT} mechanical=${MECHANICAL:-false})"

  ruff:
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22
      - name: ruff
        run: uvx ruff@0.16.5 check --force-exclude .

  shellcheck:
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: .git

  release-check:
    # floor: always-run
    # release-check refuses a plugin change without a version bump;
    # a mechanical PR (a Renovate bump inside a plugin) can still need one.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Incubator
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout work-lifecycle (pinned, for the release scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/core-skills
          ref: da3609c4bd67f830eb4f9a278c48f3010c9683a4 # main, 2026-09-04
          path: work-lifecycle
      - name: Check plugin version discipline
        working-directory: Incubator
        run: bash ../work-lifecycle/.github/scripts/check-plugin-version.sh plugins/incubator incubator
