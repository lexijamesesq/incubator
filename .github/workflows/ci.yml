name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

# Cancel a superseded in-flight run when a PR gets a new push — but NEVER cancel
# a push-to-main run (cancel is gated to pull_request events; on push-to-main
# `cancel-in-progress` is false). On `pull_request`, github.ref is already
# per-PR (refs/pull/<N>/merge), so the group is PR-scoped.
#
# For push, keying on github.ref alone put every push to main in the same
# group — GitHub keeps only one pending run per group and replaces it, so
# a second quick push could silently drop the first push's run (now
# release-tag's own run, folded in from release.yml). Per-sha for push
# events gives every commit its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1
      check_name: checks

  ruff:
    name: ci / ruff
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22
      - name: ruff
        run: uvx ruff@0.16.5 check --force-exclude .

  shellcheck:
    name: ci / shellcheck
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: .git

  release-check:
    name: ci
    # floor: always-run
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: lexijamesesq/dotty/.github/workflows/estate-plugin-release.yml@v1
    with:
      dotty_ref: v1
      plugins: '[{"path":"plugins/incubator","name":"incubator"}]'

  release-tag:
    name: ci
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: lexijamesesq/dotty/.github/workflows/estate-plugin-release.yml@v1
    with:
      dotty_ref: v1
      plugins: '[{"path":"plugins/incubator","name":"incubator"}]'
