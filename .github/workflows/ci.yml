name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

# Cancel a superseded in-flight run when a PR gets a new push — but NEVER cancel
# a push-to-main run (cancel is gated to pull_request events; on push-to-main
# `cancel-in-progress` is false). On `pull_request`, github.ref is already
# per-PR (refs/pull/<N>/merge), so the group is PR-scoped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  universal-ci:
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v2026.09.18
    with:
      dotty_ref: v2026.09.18

  all-checks-passed:
    needs: [universal-ci, ruff, shellcheck, release-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "one or more required jobs failed"
            exit 1
          fi
          echo "all checks passed"

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22
      - name: ruff
        run: uvx ruff@0.16.5 check --force-exclude .

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: .git

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Incubator
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout work-lifecycle (pinned, for the release scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/core-skills
          ref: da3609c4bd67f830eb4f9a278c48f3010c9683a4 # main, 2026-09-04
          path: work-lifecycle
      - name: Check plugin version discipline
        working-directory: Incubator
        run: bash ../work-lifecycle/.github/scripts/check-plugin-version.sh plugins/incubator incubator
