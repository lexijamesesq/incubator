name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Incubator
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout work-lifecycle (pinned, for the release scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/work-lifecycle
          ref: da3609c4bd67f830eb4f9a278c48f3010c9683a4 # main, 2026-09-04
          path: work-lifecycle
      - name: Configure git identity for the release commit
        working-directory: Incubator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: Tag and release the incubator plugin
        working-directory: Incubator
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../work-lifecycle/.github/scripts/tag-plugin-release.sh plugins/incubator incubator
