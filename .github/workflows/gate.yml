name: Gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-scan:
    uses: lexijamesesq/dotty/.github/workflows/estate-gate.yml@v2026.09.07-2
    with:
      dotty_ref: v2026.09.07-2
    secrets:
      OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
